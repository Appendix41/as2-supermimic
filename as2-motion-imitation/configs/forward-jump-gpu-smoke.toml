[train]
motion = "data/processed/as2_forward_jump.npz"
recorded_commands = "data/raw/as2-native-forward-jump/physics_capture.npz"
output = "outputs/training/forward-jump-gpu-smoke"
physics_backend = "mjwarp"
reference_reset = true
num_envs = 16
seed = 23
iterations = 4
warmup_iterations = 2
initial_collect = 32
collect_steps = 4
buffer_len = 100
wm_batch = 32
imag_batch = 16
wm_updates = 2
wm_hidden = [128, 128]
actor_hidden = [64, 32]
critic_hidden = [64, 32]
action_noise = 0.2
noise_correlation = 0.85
reference_driver_fraction = 0.5
phase_prioritized_fraction = 0.5
log_interval = 1
save_interval = 2
