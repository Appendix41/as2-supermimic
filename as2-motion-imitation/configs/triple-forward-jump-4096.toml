[train]
motion = "data/processed/as2_triple_forward_jump.npz"
recorded_commands = "data/raw/as2-native-triple-forward-jump/physics_capture.npz"
output = "outputs/training/triple-forward-jump-4096-v1"
physics_backend = "mjwarp"
reference_reset = true
num_envs = 4096
seed = 23
iterations = 1600
warmup_iterations = 400
initial_collect = 700
collect_steps = 4
buffer_len = 800
wm_window = 8
horizon = 32
wm_batch = 512
imag_batch = 256
wm_updates = 4
wm_hidden = [1024, 1024, 1024]
actor_hidden = [512, 256, 128]
critic_hidden = [512, 256, 128]
critic_epochs = 4
lr = 0.0002
actor_lr_scale = 0.25
actor_ramp_iterations = 200
action_noise = 0.20
noise_correlation = 0.85
reference_driver_fraction = 0.5
phase_prioritized_fraction = 0.5
phase_windows = [[1.5, 3.4], [4.3, 6.2], [7.1, 9.0]]
model_audit_interval = 200
model_audit_phases = [0.4, 1.6, 1.84, 2.1, 2.32, 2.5, 3.2, 4.4, 4.64, 4.9, 5.12, 5.3, 6.0, 7.2, 7.44, 7.7, 7.92, 8.1]
model_gate_relative_error = 1.0
model_gate_cosine = 0.6
save_interval = 200
log_interval = 20
