[train]
motion = "data/processed/as2_backflip.npz"
recorded_commands = "data/raw/as2-native-backflip/physics_capture.npz"
output = "outputs/training/backflip-gpu-smoke"
physics_backend = "mjwarp"
reference_reset = true
num_envs = 16
seed = 23
iterations = 4
warmup_iterations = 2
initial_collect = 32
collect_steps = 4
buffer_len = 100
wm_window = 8
horizon = 32
wm_batch = 32
imag_batch = 16
wm_updates = 2
wm_hidden = [1024, 1024, 1024]
actor_hidden = [512, 256, 128]
critic_hidden = [512, 256, 128]
action_noise = 0.15
noise_correlation = 0.85
reference_driver_fraction = 0.5
phase_prioritized_fraction = 0.6
phase_windows = [[1.3, 2.7]]
log_interval = 1
save_interval = 2
