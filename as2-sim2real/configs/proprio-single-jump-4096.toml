[train]
motion = "data/processed/as2_forward_jump.npz"
recorded_commands = "data/raw/as2-native-forward-jump/physics_capture.npz"
output = "outputs/training/proprio-single-jump-4096-v1"
physics_backend = "mjwarp"
reference_reset = true
num_envs = 4096
seed = 23
iterations = 1400
warmup_iterations = 300
initial_collect = 420
collect_steps = 4
buffer_len = 600
wm_window = 8
horizon = 32
wm_batch = 512
imag_batch = 256
wm_updates = 4
wm_hidden = [1024, 1024, 1024]
actor_hidden = [512, 256, 128]
critic_hidden = [512, 256, 128]
critic_epochs = 4
lr = 0.0002
actor_lr_scale = 0.25
actor_ramp_iterations = 200
action_noise = 0.20
noise_correlation = 0.85
reference_driver_fraction = 0.5
phase_prioritized_fraction = 0.5
phase_window = [1.5, 3.4]
model_audit_interval = 100
model_gate_relative_error = 1.0
model_gate_cosine = 0.6
save_interval = 200
log_interval = 20
sensor_noise_std = [0.01, 0.003, 0.002, 0.03]
