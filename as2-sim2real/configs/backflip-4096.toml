[train]
motion = "data/processed/as2_backflip.npz"
recorded_commands = "data/raw/as2-native-backflip/physics_capture.npz"
output = "outputs/training/backflip-4096-v1"
physics_backend = "mjwarp"
reference_reset = true
num_envs = 4096
seed = 23
iterations = 2400
warmup_iterations = 600
initial_collect = 500
collect_steps = 4
buffer_len = 800
wm_window = 8
horizon = 32
wm_batch = 512
imag_batch = 256
wm_updates = 4
wm_hidden = [1024, 1024, 1024]
actor_hidden = [512, 256, 128]
critic_hidden = [512, 256, 128]
critic_epochs = 4
lr = 0.0002
actor_lr_scale = 0.25
actor_ramp_iterations = 300
action_noise = 0.15
noise_correlation = 0.85
reference_driver_fraction = 0.5
phase_prioritized_fraction = 0.6
phase_windows = [[1.3, 2.7]]
model_audit_interval = 200
model_audit_phases = [0.4, 1.3, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.2, 2.4, 2.7, 3.4]
model_gate_relative_error = 1.0
model_gate_cosine = 0.6
model_gate_rotation = true
save_interval = 200
log_interval = 20
